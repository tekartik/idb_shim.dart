<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SDB app</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="app.dart.js"></script>
</head>
<body>
  <h2 id="title">App</h2>
  <label class="option">
    On version change (read when opening):
    <select id="version_change_action">
      <option value="close">close (default)</option>
      <option value="none">none: keep open, the other app waits</option>
      <option value="closeAndReload">close and reload</option>
      <option value="closeAlertAndReload">close, alert and reload</option>
    </select>
  </label>
  <label class="option">
    When blocked:
    <select id="blocked_action">
      <option value="alert">alert (default)</option>
      <option value="none">none: a banner from the callback</option>
    </select>
  </label>
  <div id="status"></div>
  <div id="input"></div>
  <pre id="output"></pre>
</body>
</html>
