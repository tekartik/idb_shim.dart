name: sdb_native_value_menu
description: sdb native values (SdbNativeValue) - browser menu storing Blob, File, CryptoKey and FileSystemHandle objects in an sdb database.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  web: '>=1.1.0'
  idb_shim: '>=2.11.0-1'
  tekartik_test_menu_browser:
    git:
      url: https://github.com/tekartik/test_menu.dart
      path: test_menu_browser
    version: '>=0.4.7'

dev_dependencies:
  dev_build: ">=1.1.7+3"
  tekartik_lints:
    git:
      url: https://github.com/tekartik/common.dart
      path: packages/lints
    version: '>=0.1.0'
  build_runner: ">=2.15.0"
  build_web_compilers: ">=4.4.19"
  lints: ">=6.1.0"
  process_run: ">=1.2.1+1"
  tekartik_app_web_build:
    git:
      url: https://github.com/tekartik/app_web_utils.dart
      path: packages/app_build
    version: '>=0.0.1'

dependency_overrides:
  idb_shim:
    path: ../../idb_shim
